appId: ai.glyphh.desktop
productName: Glyphh Desktop
copyright: Copyright © 2026 Glyphh AI


mac:
  category: public.app-category.developer-tools
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Glyphh. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Glyphh-${arch}.${ext}"
  # Ship the Swift window-arrange helper (scripts/build-mac-helper.sh) into
  # Contents/Resources so the PACKAGED app can position native windows —
  # mac-helper-backend.ts resolves it at process.resourcesPath/glyphh-window-helper.
  # Without this the helper is missing in prod and window arranging silently no-ops.
  extraResources:
    - from: native/mac-window-helper/build/glyphh-window-helper
      to: glyphh-window-helper

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Glyphh-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glyphh
  runAfterFinish: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/koffi/**/*

publish:
  provider: github
  owner: glyphh-ai
  repo: glyphh-releases
