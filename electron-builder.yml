appId: ai.glyphh.desktop
productName: Glyphh Desktop
copyright: Copyright © 2026 Glyphh AI


mac:
  category: public.app-category.developer-tools
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Glyphh. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Glyphh-${arch}.${ext}"
win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Glyphh-Setup.${ext}"

# UBUNTU / Linux (2026-08-26). AppImage is the primary artifact because it is
# the ONE Linux format electron-updater can auto-update (deb cannot), so a
# Linux install stays on the same update feed as mac/win; the .deb rides along
# for people who want apt-managed installs and will simply not self-update.
# No signing or notarization exists on this platform.
linux:
  category: Development
  # The 512x512 PNG is what electron-builder wants here; it derives the rest.
  icon: assets/icon.png
  synopsis: The agent workbench
  desktop:
    StartupWMClass: Glyphh Desktop
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "Glyphh-${arch}.${ext}"

nsis:
  # Explicit — don't rely on auto-detecting assets/installer.nsh (the running-app
  # check override + VC++ redist install live there).
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glyphh
  runAfterFinish: true

# Windows only: fetch the VC++ redistributable into assets/ so the NSIS custom
# script (assets/installer.nsh) can install the runtime kuzu's native module
# needs. No-op on macOS.
beforePack: scripts/before-pack.cjs

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

# The LOCAL HARNESS POD, vendored. CI builds rrotor (dist + pruned
# node_modules; no native modules — better-sqlite3 loads lazily and the local
# pod runs the memory backend) into vendor/rrotor, and the app spawns it as
# Electron-as-node (glyphh-harness-run.ts vendoredRotor). Outside the asar on
# purpose: the pod is a separate PROCESS tree (plus the Agent SDK's own
# subprocess), and subprocesses need real files, not asar members. Without
# this a packaged build had NO local pod at all — `rrotor` on PATH can never
# resolve from a dock launch (GUI PATH is /usr/bin:/bin:...), so the first
# local-folder session died with a swallowed ENOENT dressed as a 15s timeout.
extraResources:
  - from: vendor/rrotor
    to: rrotor

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/koffi/**/*
  - node_modules/kuzu/**/*

publish:
  provider: github
  owner: glyphh-ai
  repo: glyphh-releases
