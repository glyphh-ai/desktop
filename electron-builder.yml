appId: dev.yosup.client
productName: Glyphh
copyright: Copyright © 2026 Glyphh AI


mac:
  category: public.app-category.developer-tools
  # Native window-control helper (Swift, universal arm64+x86_64) — CGWindowList
  # enumeration + AX positioning for .dip / layout tiling. extraResources puts
  # it in Contents/Resources; binaries signs it with the app's Hardened Runtime
  # so notarization passes.
  extraResources:
    - from: native/mac-window-helper/build/glyphh-window-helper
      to: glyphh-window-helper
  binaries:
    - Contents/Resources/glyphh-window-helper
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Glyphh. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Glyphh-${arch}.${ext}"

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Glyphh-Setup.${ext}"

nsis:
  # Assisted installer (NOT one-click). The default one-click installer
  # installs silently and just launches the app — which reads as "it only
  # opened the app, it never installed" and leaves users unable to find Glyphh
  # afterwards. An assisted installer shows a real wizard: an install-location
  # step, a progress page, and an "Installation Complete" finish page.
  oneClick: false
  perMachine: false              # per-user install — no admin prompt needed
  allowElevation: true           # but allow opting into an all-users install
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glyphh
  runAfterFinish: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*
  # koffi ships prebuilt .node binaries (Windows user32 window control) —
  # native modules must live outside the asar.
  - node_modules/koffi/**/*
  # kuzu (embedded graph DB behind the apps' graph.cypher capability) ships a
  # prebuilt N-API binary.
  - node_modules/kuzu/**/*

publish:
  provider: github
  owner: glyphh-ai
  repo: glyphh-releases
