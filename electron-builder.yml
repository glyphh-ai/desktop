appId: dev.yosup.client
productName: Glyphh Apps
copyright: Copyright © 2026 Glyphh AI


mac:
  category: public.app-category.developer-tools
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Glyphh. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Glyphh-${arch}.${ext}"

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Glyphh-Setup.${ext}"

nsis:
  # Assisted installer (NOT one-click). The default one-click installer
  # installs silently and just launches the app — which reads as "it only
  # opened the app, it never installed" and leaves users unable to find Glyphh
  # afterwards. An assisted installer shows a real wizard: an install-location
  # step, a progress page, and an "Installation Complete" finish page.
  oneClick: false
  perMachine: false              # per-user install — no admin prompt needed
  allowElevation: true           # but allow opting into an all-users install
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glyphh
  runAfterFinish: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*

publish:
  provider: github
  owner: glyphh-ai
  repo: glyphh-releases
