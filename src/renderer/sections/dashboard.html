<!-- Dashboard / Home — the landing section. Populated by help/dashboard.ts
     (loadDashboard) from server usage/billing endpoints. -->
<div class="help-section" data-section="dashboard">
  <div class="dash-scroll">

    <!-- Header: the cat beside the greeting, centered. -->
    <div class="dash-header">
      <img class="dash-mark" src="brand/glyphh-mark.png" alt="" />
      <div class="dash-header-text">
        <h1 class="dash-greeting" id="dash-greeting">Welcome back</h1>
      </div>
    </div>

    <!-- App notifications — hidden until an app posts one. -->
    <div id="dash-notifications" class="dash-notifications hidden"></div>

    <!-- The FULL glyphh agent footer adopts into this slot while Home is
         up — input, chips, the entire second row (adoptComposer). -->
    <div id="dash-composer-slot" class="dash-composer-slot"></div>

    <!-- Under the chart: prompt starters LEFT, the cross-agent schedule RIGHT. -->
    <div class="dash-two-col">
      <div class="dash-card">
        <div class="dash-card-label">Recommended for you</div>
        <div id="dash-recs" class="dash-recs"></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">Recent runs</div>
        <input id="dash-tasks-search" class="crud-search dash-tasks-search" type="text" placeholder="Search runs..." spellcheck="false" autocomplete="off" />
        <div id="dash-tasks-list" class="dash-tasks-list"></div>
        <div id="dash-tasks-pager"></div>
      </div>
    </div>

  </div>
</div>
