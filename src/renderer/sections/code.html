        <div class="help-section" data-section="code">
          <div class="code-root">

            <!-- Sessions live in the Coding Agent panel's history dropdown. -->

            <!-- Center — the agent -->
            <section class="code-agent">
              <div class="code-agent-head">
                <!-- In-thread session head (SessionHeader port): ‹ + locus icon
                     + name — ‹/name opens the space's list view. -->
                <button id="code-session-back" class="session-head-back" title="All sessions" type="button">
                  <svg class="session-head-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                  <span id="code-session-locus" class="session-head-locus" title="Where this session runs"></span>
                  <span id="code-session-title" title="Current session">New session</span>
                </button>
                <!-- Workdir controls (old workbench header): folder picker +
                     git branch (shown once a repo is picked) + add-folder.
                     Wiring lands with the William loop. -->

                <!-- + and recents live at the TOP LEFT of every agent view,
                     left of the kebab: new session (this agent's type) and the
                     recents dropdown (scoped to this type). -->

                <div class="code-spacer"></div>

                <div class="session-head-actions">
                <div id="code-session-kebab-wrap" class="code-chipwrap">
                  <button id="code-session-kebab" class="code-icon-btn session-head-kebab" title="Session actions" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
                  </button>
                </div>
                </div>


                <!-- Session kebab (SessionHeader port): Rename / Pin / Delete.
                     The head's ONLY right-side control on EVERY space — lives
                     outside the Code-only workbench toggles so Chat + Work keep
                     it (the platform shows the kebab in all three spaces). -->

                <!-- (View toggles moved: the ⋮ work-panels menu lives on the
                     agent's top row now, right of the + — it opens UPWARD.) -->
              </div>

              <div id="code-thread" class="code-thread"></div>
              <!-- Collapsed (centre-anchored) mode: the thread is hidden and the
                   whole conversation reduces to this one line. The caret PEEKS —
                   it floats the live thread up over the layout without costing
                   the layout any space. A <button> so it is keyboard-reachable. -->
              <div class="code-agent-toprow">
                <!-- The status TEXT is the peek control — click it to open/close
                     the thread panel (the caret glyph is gone). -->
                <button id="code-status-line" class="code-status-line" type="button" hidden>
                  <span id="code-status-text" class="code-status-text"></span>
                </button>

              </div>
              <div class="code-composer">
                <div id="code-ask-dock" class="code-ask-dock" hidden></div>
                <!-- Notes typed while the agent is running. They wait here until the
                     run ends, then go as the next turn — deletable until they do. -->
                <div id="code-pending-notes" class="code-pending-notes" hidden></div>
                <div id="code-attach-chips" class="code-attach-chips" hidden></div>
                <!-- Workspace-source chip (Work + Code only) — where the next
                     session RUNS + what it works on. Hidden in Chat via CSS. -->
                <!-- THE FLOATING INPUT CARD — the composer's one visual object
                     (input + chips inside), floating over the wall like the
                     dock. The source/folder row sits BELOW it, outside. -->
                <div class="code-pill-row">
                <div class="code-input-card">
                <!-- Source / git / folder — its own row ABOVE the input, left. -->
                <div id="code-source-slot" class="code-source-slot">
                  <button id="code-workdir-btn" class="code-wd-btn" title="Pick the working folder" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                    <span id="code-workdir-name">Pick a folder</span>
                  </button>
                  <span class="code-wd-branch" id="code-workdir-branch-wrap" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8"/><path d="M18 10v1a4 4 0 0 1-4 4H8"/></svg>
                    <span id="code-workdir-branch"></span>
                  </span>
                  <button id="code-workdir-add" class="code-icon-btn" title="Add folder" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                  </button>
                  <span class="code-source-spacer"></span>
                  <button id="code-agent-lock" class="code-icon-btn" title="Lock the agent up (stays visible over open panels)" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                  </button>
                  <!-- Session controls (recents / + new / ⋯ dev tools). In a
                       layout this whole group RELOCATES into the agent panel's
                       header, right of the session name (help/code.ts). -->
                  <div id="code-session-controls" class="code-session-controls">
                  <span class="echo-drip-anchor">
                    <button id="code-drips-btn" class="code-icon-btn" title="Drips" type="button">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    </button>
                    <div id="code-drip-pop" class="echo-drip-pop hidden"></div>
                  </span>
                  <button id="code-session-history" class="code-icon-btn" title="Session history" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  </button>
                  <button id="code-session-new" class="code-icon-btn" title="New session" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  </button>
                  <div id="code-tools-wrap" class="code-view-more-wrap">
                    <button id="code-tools-more" class="code-icon-btn" title="Developer tools" type="button" aria-haspopup="true">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                    </button>
                    <div id="code-tools-menu" class="code-view-more-menu hidden"></div>
                  </div>
                  </div>
                </div>
                <div class="code-input-wrap">
                  <div id="code-plus-wrap" class="code-chipwrap">
                    <button id="code-plus-chip" class="code-chip code-plus-chip" type="button" title="Add to this session — files, folders, images (paste and drag-drop work too)">+</button>
                  </div>
                  <textarea id="code-input" class="code-input" rows="1" placeholder="Describe the app to build…" spellcheck="false"></textarea>
                  <div id="code-mic-wrap" class="code-chipwrap hidden">
                    <button id="code-mic-chip" class="code-chip code-mic-chip" type="button" title="Hold to talk — press and hold, release to transcribe">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                    </button>
                  </div>
                  <!-- Live mic waveform — a transparent overlay drawn while recording
                       voice input (voice-mic.ts). Hidden + pointer-transparent otherwise. -->
                  <canvas id="code-rec-wave" class="code-rec-wave hidden" aria-hidden="true"></canvas>
                  <button id="code-send" class="code-send" title="Send">
                    <svg class="icon-return" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
                    <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
                  </button>
                </div>
                <div class="code-composer-bar">
                  <!-- Left group: permission chip with the + (add files/folder)
                       immediately to its right — space-between must not strand
                       the + in the middle of the bar. -->
                  <div class="code-bar-left">
                    <div id="code-mode-wrap" class="code-chipwrap">
                      <button id="code-mode-chip" class="code-chip" type="button"></button>
                    </div>
                    <!-- Voice input: hidden unless Settings › Voice enables it. Click to
                         record, click to stop → transcribed into the composer. -->
                    <!-- Appears only while the agent is speaking a reply aloud —
                         click (or Esc) to stop the voice. -->
                    <div id="code-speak-wrap" class="code-chipwrap hidden">
                      <button id="code-speak-stop" class="code-chip code-speak-stop" type="button" title="Stop the spoken reply (Esc)">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                        <span>Stop</span>
                      </button>
                    </div>
                  </div>
                  <div class="code-bar-right">
                    <div id="code-model-wrap" class="code-chipwrap">
                      <button id="code-model-chip" class="code-chip" type="button"></button>
                    </div>
                    <div id="code-effort-wrap" class="code-chipwrap">
                      <button id="code-effort-chip" class="code-chip" type="button"></button>
                    </div>
                    <div id="code-ctx-wrap" class="code-chipwrap">
                      <div id="code-ctx-meter" class="code-ctx-meter" title="Context">
                        <div class="ctx-tick"></div>
                        <div class="ctx-fill"></div>
                      </div>
                    </div>
                  </div>
                </div>
                </div><!-- /.code-input-card -->
                <div class="code-side-band">
                  <button id="code-opts-caret" class="ws-icon-btn" type="button" title="Show session options">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
                  </button>
                  <button id="code-cc-open" class="ws-icon-btn" type="button" title="Show the command center (hold ⌃⌥)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                  </button>
                  <button id="code-reset-open" class="ws-icon-btn" type="button" title="Reset — close every panel, back to the command center">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><polyline points="21 3 21 9 15 9"/></svg>
                  </button>
                </div>
                </div><!-- /.code-pill-row -->
              </div>
            </section>

            <!-- Right — the workbench rails (the old workbench engine, ported:
                 code-workbench-bundle.js). Closed until a view is opened from
                 the header toggles; slots insert/tile/drag/maximize per the
                 old rules, layout persists per working folder. -->
            <aside id="code-workbench" class="code-workbench collapsed">
              <div id="code-wb-edge" class="code-wb-edge" title="Drag to resize"></div>
              <div id="code-wb-rails" class="ws-right-rails"></div>
            </aside>

          </div>
        </div>
