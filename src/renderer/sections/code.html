        <div class="help-section" data-section="code">
          <div class="code-root">

            <!-- Sessions live in the Coding Agent panel's history dropdown. -->

            <!-- Center — the agent -->
            <section class="code-agent">
              <div class="code-agent-head">
                <!-- In-thread session head (SessionHeader port): ‹ + locus icon
                     + name — ‹/name opens the space's list view. -->
                <button id="code-session-back" class="session-head-back" title="All sessions" type="button">
                  <svg class="session-head-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                  <span id="code-session-locus" class="session-head-locus" title="Where this session runs"></span>
                  <span id="code-session-title" title="Current session">New session</span>
                </button>
                <!-- Workdir controls (old workbench header): folder picker +
                     git branch (shown once a repo is picked) + add-folder.
                     Wiring lands with the William loop. -->

                <!-- + and recents live at the TOP LEFT of every agent view,
                     left of the kebab: new session (this agent's type) and the
                     recents dropdown (scoped to this type). -->

                <div class="code-spacer"></div>

                <div class="session-head-actions">
                  <!-- Opens the full transcript as a workbench panel. Sits LEFT of
                       recents once collapsed mode relocates this whole group into
                       the composer's source row. -->
                  <button id="code-transcript-btn" class="code-icon-btn" title="Open the transcript panel" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  </button>
                  <button id="code-session-new" class="code-icon-btn" title="New session" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  </button>
                  <button id="code-session-history" class="code-icon-btn" title="Session history" type="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  </button>
                <div id="code-session-kebab-wrap" class="code-chipwrap">
                  <button id="code-session-kebab" class="code-icon-btn session-head-kebab" title="Session actions" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
                  </button>
                </div>
                </div>


                <!-- Session kebab (SessionHeader port): Rename / Pin / Delete.
                     The head's ONLY right-side control on EVERY space — lives
                     outside the Code-only workbench toggles so Chat + Work keep
                     it (the platform shows the kebab in all three spaces). -->

                <!-- Workbench view toggles (old wb-section-toggles): each opens
                     its rail on the right; accent = open. Code space only. -->
                <div class="code-view-toggles">
                  <!-- Where the agent sits: left / centre / right / hidden. -->
                  <div id="code-anchor-wrap" class="code-anchor-wrap">
                    <button id="code-anchor-btn" class="code-view-btn" title="Anchor the agent" type="button">
                      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
                    </button>
                    <div id="code-anchor-menu" class="code-drop code-anchor-menu hidden"></div>
                  </div>
                  <div id="code-view-more-wrap" class="code-view-more-wrap">
                    <button id="code-view-more" class="code-view-btn" title="More panels" type="button">
                      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                    </button>
                    <div id="code-view-more-menu" class="code-drop code-view-more-menu hidden">
                      <button class="code-view-btn code-view-menu-item" data-view="files" title="Files">
                        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                        <span>Files</span>
                      </button>
                      <button class="code-view-btn code-view-menu-item" data-view="terminal" title="Terminal">
                        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                        <span>Terminal</span>
                      </button>
                      <button class="code-view-btn code-view-menu-item" data-view="monaco" title="Editor">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <span>Editor</span>
                      </button>
                      <button class="code-view-btn code-view-menu-item" data-view="diff" title="Diff">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><polyline points="8 7 4 11 8 15"/><polyline points="16 9 20 13 16 17"/></svg>
                        <span>Diff</span>
                      </button>
                      <button class="code-view-btn code-view-menu-item" data-view="preview" title="Browser">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <span>Browser</span>
                      </button>
                      <button class="code-view-btn code-view-menu-item" data-view="plan" title="Plan">
                        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        <span>Plan</span>
                      </button>
                      <!-- Office ▸ — Glyphh Office: agent-authored documents
                           (Slides live; Drive/Docs/Sheets join as they ship). -->
                      <div class="code-view-menu-sub-wrap">
                        <button class="code-view-btn code-view-menu-item code-view-menu-more" type="button" title="Glyphh Office">
                          <svg viewBox="0 0 24 24"><path d="M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7h-2V5.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5V7z" style="fill:#6d28d9;stroke:none"/><rect x="2.5" y="7" width="19" height="13.5" rx="2.5" style="fill:#8c3bf2;stroke:none"/><path d="M2.5 12.2h19v2.2h-19z" style="fill:#6d28d9;stroke:none"/><rect x="10.3" y="11.6" width="3.4" height="3.4" rx="1.1" style="fill:#ffffff;stroke:none"/></svg>
                          <span>Office</span>
                          <svg class="code-view-menu-sub-caret" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
                        </button>
                        <div class="code-drop code-view-submenu">
                          <button class="code-view-btn code-view-menu-item" data-view="gpoint" title="Glyphh Slides — agent-built presentations">
                            <svg viewBox="0 0 24 24"><rect x="2" y="3.5" width="20" height="13" rx="2.5" style="fill:#8c3bf2;stroke:none"/><path d="M11 16.5h2v2.2h3.2a.9.9 0 1 1 0 1.8H7.8a.9.9 0 1 1 0-1.8H11z" style="fill:#6d28d9;stroke:none"/><path d="M10 7.2 15.4 10 10 12.8z" style="fill:#ffffff;stroke:none"/></svg>
                            <span>Slides</span>
                          </button>
                          <button class="code-view-btn code-view-menu-item" data-view="gdoc" title="Glyphh Docs — agent-written documents">
                            <svg viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2h7L20 7.5v12A2.5 2.5 0 0 1 17.5 22h-10A2.5 2.5 0 0 1 5 19.5z" style="fill:#3b82f6;stroke:none"/><path d="M14.5 2 20 7.5h-4A1.5 1.5 0 0 1 14.5 6z" style="fill:#1d4ed8;stroke:none"/><rect x="8" y="10.6" width="8" height="1.7" rx="0.85" style="fill:#ffffff;stroke:none"/><rect x="8" y="14" width="8" height="1.7" rx="0.85" style="fill:#ffffff;stroke:none"/><rect x="8" y="17.4" width="5.2" height="1.7" rx="0.85" style="fill:#ffffff;stroke:none"/></svg>
                            <span>Docs</span>
                          </button>
                          <button class="code-view-btn code-view-menu-item" data-view="gsheet" title="Glyphh Sheets — agent-built workbooks">
                            <svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="3" style="fill:#10b981;stroke:none"/><rect x="6" y="5.6" width="12" height="2.4" rx="1.2" style="fill:#ffffff;stroke:none"/><rect x="6" y="10" width="5.4" height="3.6" rx="1" style="fill:#a7f3d0;stroke:none"/><rect x="12.6" y="10" width="5.4" height="3.6" rx="1" style="fill:#ffffff;stroke:none"/><rect x="6" y="14.8" width="5.4" height="3.6" rx="1" style="fill:#ffffff;stroke:none"/><rect x="12.6" y="14.8" width="5.4" height="3.6" rx="1" style="fill:#a7f3d0;stroke:none"/></svg>
                            <span>Sheets</span>
                          </button>
                          <button class="code-view-btn code-view-menu-item" data-view="gdrive" title="Glyphh Drive — every Office file, in folders">
                            <svg viewBox="0 0 24 24"><path d="M6.1 4.6A2.5 2.5 0 0 1 8.4 3h7.2a2.5 2.5 0 0 1 2.3 1.6L21.5 12h-19z" style="fill:#2dd4bf;stroke:none"/><path d="M2.5 12h19v5.5A2.5 2.5 0 0 1 19 20H5a2.5 2.5 0 0 1-2.5-2.5z" style="fill:#0f766e;stroke:none"/><circle cx="6.8" cy="16" r="1.25" style="fill:#ffffff;stroke:none"/><circle cx="10.6" cy="16" r="1.25" style="fill:#5eead4;stroke:none"/></svg>
                            <span>Drive</span>
                          </button>
                        </div>
                      </div>
                      <!-- More ▸ — the less-used panels, one flyout deeper. -->
                      <div class="code-view-menu-sub-wrap">
                        <button class="code-view-btn code-view-menu-item code-view-menu-more" type="button" title="More panels">
                          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                          <span>More</span>
                          <svg class="code-view-menu-sub-caret" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
                        </button>
                        <div class="code-drop code-view-submenu">
                          <button class="code-view-btn code-view-menu-item" data-view="releases" title="Releases — manage and publish your app's builds">
                            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                            <span>Releases</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div id="code-thread" class="code-thread"></div>
              <!-- Collapsed (centre-anchored) mode: the thread is hidden and the
                   whole conversation reduces to this one line. The caret PEEKS —
                   it floats the live thread up over the layout without costing
                   the layout any space. A <button> so it is keyboard-reachable. -->
              <button id="code-status-line" class="code-status-line" type="button" hidden>
                <span id="code-status-text" class="code-status-text"></span>
                <svg class="code-peek-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
              <div class="code-composer">
                <div id="code-ask-dock" class="code-ask-dock" hidden></div>
                <!-- Notes typed while the agent is running. They wait here until the
                     run ends, then go as the next turn — deletable until they do. -->
                <div id="code-pending-notes" class="code-pending-notes" hidden></div>
                <div id="code-attach-chips" class="code-attach-chips" hidden></div>
                <!-- Workspace-source chip (Work + Code only) — where the next
                     session RUNS + what it works on. Hidden in Chat via CSS. -->
                <!-- Workspace chips — ONE row above the input on every surface:
                     [source] [folder] [git] [+]. They used to split between the
                     agent header and here, so Work/Code looked different from
                     the landing. -->
                <div id="code-source-slot" class="code-source-slot">
                <button id="code-workdir-btn" class="code-wd-btn" title="Pick the working folder" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
                  <span id="code-workdir-name">Pick a folder</span>
                </button>
                <span class="code-wd-branch" id="code-workdir-branch-wrap" style="display:none;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8"/><path d="M18 10v1a4 4 0 0 1-4 4H8"/></svg>
                  <span id="code-workdir-branch"></span>
                </span>
                <button id="code-workdir-add" class="code-icon-btn" title="Add folder" type="button">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                </button>
                <!-- Collapsed mode parks [transcript][recents][+][anchor] here, at
                     the right end of the source/folder/git row. The nodes are MOVED,
                     never re-rendered, so their listeners ride along. Nothing in the
                     anchor code may set innerHTML on this element. -->
                <div id="code-bar-actions" class="code-bar-actions"></div>
                </div>
                <div class="code-input-wrap">
                  <textarea id="code-input" class="code-input" rows="1" placeholder="Describe the app to build…" spellcheck="false"></textarea>
                  <button id="code-send" class="code-send" title="Send">
                    <svg class="icon-return" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
                    <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
                  </button>
                </div>
                <div class="code-composer-bar">
                  <!-- Left group: permission chip with the + (add files/folder)
                       immediately to its right — space-between must not strand
                       the + in the middle of the bar. -->
                  <div class="code-bar-left">
                    <div id="code-mode-wrap" class="code-chipwrap">
                      <button id="code-mode-chip" class="code-chip" type="button"></button>
                    </div>
                    <div id="code-plus-wrap" class="code-chipwrap">
                      <button id="code-plus-chip" class="code-chip code-plus-chip" type="button" title="Add to this session — files, folders, images (paste and drag-drop work too)">+</button>
                    </div>
                    <!-- Collapsed (centre-anchored) mode only: the left rail is
                         out of reach, so Apps + Workspaces open as DROP-UP
                         popovers from these chips. Hidden in every other mode. -->
                    <div id="code-mini-trays" class="code-mini-trays">
                      <button id="code-tray-apps" class="code-chip" type="button" title="Apps">Apps</button>
                      <button id="code-tray-layouts" class="code-chip" type="button" title="Workspaces">Workspaces</button>
                    </div>
                  </div>
                  <div class="code-bar-right">
                    <div id="code-model-wrap" class="code-chipwrap">
                      <button id="code-model-chip" class="code-chip" type="button"></button>
                    </div>
                    <div id="code-effort-wrap" class="code-chipwrap">
                      <button id="code-effort-chip" class="code-chip" type="button"></button>
                    </div>
                    <div id="code-ctx-wrap" class="code-chipwrap">
                      <div id="code-ctx-meter" class="code-ctx-meter" title="Context">
                        <div class="ctx-tick"></div>
                        <div class="ctx-fill"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Dock splitter. Only live in left/right; the workbench's own
                   #code-wb-edge assumes the aside is at the right edge, so it is
                   hidden while anchored rather than taught to invert. -->
              <div id="code-agent-edge" class="code-agent-edge" title="Drag to resize"></div>
            </section>

            <!-- Right — the workbench rails (the old workbench engine, ported:
                 code-workbench-bundle.js). Closed until a view is opened from
                 the header toggles; slots insert/tile/drag/maximize per the
                 old rules, layout persists per working folder. -->
            <aside id="code-workbench" class="code-workbench collapsed">
              <div id="code-wb-edge" class="code-wb-edge" title="Drag to resize"></div>
              <div id="code-wb-rails" class="ws-right-rails"></div>
            </aside>

          </div>
        </div>
