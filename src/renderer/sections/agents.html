        <div class="help-section" data-section="agents">
          <h2>Agents</h2>
          <p class="section-desc">Your local agent library — the team a swarm draws from.</p>
          <div id="agents-toolbar" class="crud-toolbar">
            <input id="agent-search" type="text" class="crud-search" placeholder="Search agents..." spellcheck="false" autocomplete="off" />
            <button id="agent-new-btn" class="action-btn primary">+ New</button>
          </div>
          <div id="agents-list" class="crud-cards"></div>
          <div id="agent-editor" class="crud-inline-form hidden">
            <div class="crud-inline-header">
              <a class="crud-breadcrumb-back" id="agent-back-link">&larr; Agents</a>
              <div class="crud-spacer"></div>
            </div>
            <div id="agent-form-error" class="crud-form-error hidden"></div>

            <label class="settings-label">Name</label>
            <input type="text" id="agent-name" class="settings-input" placeholder="Researcher" spellcheck="false" autocomplete="off" />

            <label class="settings-label">Role</label>
            <input type="text" id="agent-role" class="settings-input" placeholder="e.g. Backend engineer" spellcheck="false" autocomplete="off" />

            <label class="settings-label">Model</label>
            <select id="agent-model" class="settings-input" style="width:auto;"></select>
            <div id="agent-model-empty" class="msg msg-warning hidden">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span>No models available yet — add a provider key under the <a id="agent-model-empty-link">Providers</a> tab to unlock models here.</span>
            </div>

            <label class="settings-label">Mode</label>
            <select id="agent-mode" class="settings-input" style="width:auto;">
              <option value="full">Full agent loop (can edit/run commands)</option>
              <option value="readonly">One-shot</option>
            </select>
            <p id="agent-mode-hint" class="field-hint hidden">This model doesn't support the full agent loop yet — one-shot only.</p>

            <label class="settings-label">System prompt</label>
            <textarea id="agent-prompt" class="settings-input" rows="6" placeholder="Instructions for this agent..."></textarea>

            <label class="settings-label" style="margin-top:8px;">Apps</label>
            <div id="agent-apps-list" style="display:flex;flex-direction:column;gap:4px;"></div>
            <button id="agent-apps-add" class="action-btn" style="align-self:flex-start;margin-top:4px;">+ Add app</button>

            <label class="settings-label" style="margin-top:8px;">Skills</label>
            <div id="agent-skills-list" style="display:flex;flex-direction:column;gap:4px;"></div>
            <button id="agent-skills-add" class="action-btn" style="align-self:flex-start;margin-top:4px;">+ Add skill</button>

            <label class="settings-label" style="margin-top:8px;">Guardrails</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="number" id="agent-guard-turns" class="settings-input" min="0" placeholder="Max turns" style="width:140px;" />
              <input type="number" id="agent-guard-tokens" class="settings-input" min="0" placeholder="Max tokens / session" style="width:180px;" />
              <input type="number" id="agent-guard-idle" class="settings-input" min="0" placeholder="Idle stop (s)" style="width:140px;" />
            </div>

            <div class="settings-actions" style="margin-top:12px;">
              <button id="agent-delete-btn" class="action-btn danger">Delete</button>
              <div style="flex:1;"></div>
              <button id="agent-cancel-btn" class="action-btn">Cancel</button>
              <button id="agent-save-btn" class="action-btn primary">Save</button>
            </div>
          </div>
        </div>
