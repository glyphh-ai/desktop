<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyphh Workbench</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="xterm.css">
<script src="monaco/loader.js"></script>
<script>
  try {
    var t = localStorage.getItem("yoTheme") || "dark";
    var r = t === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : t;
    document.documentElement.setAttribute("data-theme", r);
  } catch (e) {}
</script>
<style>
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    /* Body matches the "Token Metrics" panel color (--surface, theme-aware). */
    background: var(--surface);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin: 0;
  }

  /* App chrome: header (name + section toggles) → workdir bar → rails fill. */
  .wb-shell { display: flex; flex-direction: column; height: 100%; }
  .wb-header {
    height: 40px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    /* Header matches the Yo agent (right-rail) header color (--surface-2). */
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .wb-header-title {
    display: inline-flex;
    align-items: baseline;
    gap: 1px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    letter-spacing: -0.02em;
    user-select: none;
  }
  .wb-header-title .dot { color: var(--accent); }
  .wb-header-spacer { flex: 1; }

  /* The workdir controls were authored for their own row (.yo-workdir-bar)
     where SVGs were constrained by `.yo-workdir-bar svg { width:13px }`.
     We've moved them inline into the header — re-scope the same constraints
     under .wb-header so the icons stay small, text doesn't wrap, and long
     branch / folder names truncate with an ellipsis instead of pushing the
     header into a multi-line layout. */
  .wb-header .yo-workdir-btn,
  .wb-header .yo-workdir-add,
  .wb-header .yo-workdir-branch {
    flex-shrink: 0;
    white-space: nowrap;
  }
  .wb-header .yo-workdir-btn span,
  .wb-header .yo-workdir-branch span {
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-header svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    stroke: currentColor;
  }
  /* Title's dot inherits the SVG rule otherwise — keep title icon-free. */
  .wb-header-title svg { width: auto; height: auto; }
  /* Section toggle icons are sized explicitly via .wb-section-btn svg; the
     generic rule above would override them, so re-assert here. */
  .wb-header .wb-section-btn svg { width: 16px; height: 16px; }

  /* Section toggle buttons (far-right): one icon per section. The icon
     lights up with the accent color when at least one slot of that view
     is open. Click to open (places a new slot per v4 rules), click again
     when open to close ALL slots of that view. */
  .wb-section-toggles {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wb-section-btn {
    background: transparent;
    border: 1px solid transparent;
    width: 28px; height: 28px;
    border-radius: 6px;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.10s, color 0.10s, border-color 0.10s;
  }
  .wb-section-btn:hover { background: var(--surface-3); color: var(--text); }
  .wb-section-btn.active {
    background: var(--accent-bg);
    /* Keep the icon contrast color (white in dark mode, dark in light) —
       only the BORDER goes accent. */
    color: var(--white);
    border-color: var(--accent);
  }
  .wb-section-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Workdir bar shares the Agent app's chrome (yo-workdir-bar styles in
     styles.css). Override the .Yo dot color to keep the workbench's
     accent feel without forking the class. */

  /* Rails container fills the remaining space. */
  .wb-body { flex: 1; min-height: 0; display: flex; }
  .ws-right-rails {
    display: flex;
    flex: 1;
    height: 100%;
    min-width: 0;
    overflow: hidden;
  }
  .ws-right-rails:empty::before {
    content: "Open a section from the header → to begin.";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    color: var(--text-faint);
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="wb-shell">
    <header class="wb-header">
      <span class="wb-header-title"><span class="dot">.</span>Workbench</span>
      <!-- Workdir controls inline in the header, immediately right of the title:
           folder picker + git branch (if a repo) + add-folder. -->
      <button class="yo-workdir-btn" id="workdir-btn" title="Pick the working folder" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        </svg>
        <span id="workdir-name">Pick a folder</span>
      </button>
      <span class="yo-workdir-branch" id="workdir-branch-wrap" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2"/>
          <circle cx="6" cy="18" r="2"/>
          <circle cx="18" cy="8" r="2"/>
          <path d="M6 8v8"/>
          <path d="M18 10v1a4 4 0 0 1-4 4H8"/>
        </svg>
        <span id="workdir-branch"></span>
      </span>
      <button class="yo-workdir-add" id="workdir-add-btn" title="Add folder" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
      <span class="wb-header-spacer"></span>
      <div class="wb-section-toggles" id="wb-section-toggles">
        <button class="wb-section-btn" data-view="files" title="Files">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        </button>
        <button class="wb-section-btn" data-view="terminal" title="Terminal">
          <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </button>
        <button class="wb-section-btn" data-view="diff" title="Diff">
          <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><polyline points="8 7 4 11 8 15"/><polyline points="16 9 20 13 16 17"/></svg>
        </button>
        <button class="wb-section-btn" data-view="preview" title="Preview">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="wb-section-btn" data-view="plan" title="Plan">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
      </div>
    </header>

    <div class="wb-body">
      <div class="ws-right-rails" id="right-rails"></div>
    </div>
  </div>

  <script src="./workbench.js"></script>
</body>
</html>
