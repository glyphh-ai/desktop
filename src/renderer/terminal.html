<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d14; }
    #terminal { width: 100%; height: 100%; padding: 4px; }
    #terminal .xterm { height: 100%; }
    .xterm-viewport::-webkit-scrollbar { width: 8px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 4px; }
    .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  </style>
  <link rel="stylesheet" href="xterm.css">
</head>
<body>
  <div id="terminal"></div>
  <script src="terminal-bundle.js"></script>
</body>
</html>
