<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  </style>
</head>
<body>
  <div id="command-center" class="command-center">
    <div class="cc-inner">
      <div class="cc-header">
        <input id="cc-input" class="cc-input" type="text" autocomplete="off" autocorrect="off"
               spellcheck="false" placeholder="Search, or run a command — .dip grid · split · min · exp · <app> — .drip <effect>" />
        <div class="cc-drip-wrap">
          <button id="cc-drip-btn" class="cc-drip-btn" title="Play a drip effect">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 6.6 9.2a6.6 6.6 0 1 0 10.8 0z"/></svg>
          </button>
          <div id="cc-drip-menu" class="cc-drip-menu hidden"></div>
        </div>
        <button id="cc-close" class="cc-close" title="Close (Esc)">&times;</button>
      </div>
      <div id="cc-apps" class="cc-apps"></div>
      <div id="cc-apps-pager" class="cc-pager"></div>
      <div id="cc-layouts-wrap" class="cc-layouts-wrap hidden">
        <div class="cc-section-label">Layouts</div>
        <div id="cc-layouts" class="cc-layouts"></div>
        <div id="cc-layouts-pager" class="cc-pager"></div>
      </div>
      <div id="cc-os-wrap" class="cc-os-wrap hidden">
        <div class="cc-section-label">Running apps</div>
        <div id="cc-os-apps" class="cc-apps"></div>
        <div id="cc-os-pager" class="cc-pager"></div>
      </div>
      <div id="cc-empty" class="cc-empty hidden">No apps yet — add one from the Apps tab.</div>
    </div>
  </div>
  <script type="module" src="command-center-ui.js"></script>
</body>
</html>
