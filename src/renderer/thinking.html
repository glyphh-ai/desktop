<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    /* Full-screen gradient scrim — a soft vignette, slightly deeper at the
       edges, dimming and blurring everything while the workspace rearranges. */
    .scrim {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center,
        rgba(10, 10, 16, 0.60) 0%,
        rgba(8, 8, 13, 0.68) 55%,
        rgba(4, 4, 8, 0.80) 100%);
      backdrop-filter: blur(12px) saturate(120%);
    }
    /* Just the mark — big, faint, breathing. No card, no text. */
    .ghost {
      width: 220px; height: 220px; object-fit: contain;
      opacity: 0.16;
      filter: grayscale(1) brightness(2.4);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.10; transform: scale(0.97); }
      50%      { opacity: 0.22; transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="scrim">
    <img class="ghost" src="brand/glyphh-mark.png" alt="" />
  </div>
</body>
</html>
