<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Glyphh Office — icon set</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, -apple-system, system-ui, sans-serif; background: #0d0d0f; color: #f1f1f1; padding: 48px 56px; }
  h1 { font-size: 26px; letter-spacing: -.02em; }
  .sub { margin-top: 8px; color: #8e8e9c; font-size: 14px; max-width: 640px; line-height: 1.5; }
  .band { border-radius: 14px; padding: 36px 40px 28px; margin-top: 28px; }
  .band.dark  { background: #101013; border: 1px solid #26262d; color: #fff; }
  .band.light { background: #fafafa; border: 1px solid #e2e2e6; color: #111; }
  .band h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .5; margin-bottom: 24px; font-weight: 600; }
  .row { display: flex; gap: 56px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cell svg { display: block; }
  .cell .big svg { width: 64px; height: 64px; }
  .cell .small { display: flex; gap: 10px; align-items: center; margin-top: 2px; opacity: .85; }
  .cell .small svg { width: 18px; height: 18px; }
  .cell .small span { font-size: 12.5px; }
  .name { font-size: 13px; font-weight: 600; }
  .band svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
<h1>Glyphh Office — icon set</h1>
<p class="sub">One stroke language, black &amp; white like the mascot: 24×24 grid, 2px stroke,
round caps, <code>currentColor</code> — white on dark, ink on light, no palette to maintain.
Slides carries the play mark; the suite mark is the briefcase.</p>

<div class="band dark">
  <h2>On dark — the app</h2>
  <div class="row" id="icons-dark"></div>
</div>
<div class="band light">
  <h2>On light</h2>
  <div class="row" id="icons-light"></div>
</div>

<script>
const ICONS = {
  "Office": '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>',
  "Drive": '<path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M2 12h20"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>',
  "Docs": '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  "Sheets": '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/>',
  "Slides": '<rect x="2" y="3" width="20" height="13" rx="2"/><polygon points="10 6.5 15 9.5 10 12.5"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/>',
  "Sites": '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
};
const svg = (body) => `<svg viewBox="0 0 24 24">${body}</svg>`;
for (const host of [document.getElementById("icons-dark"), document.getElementById("icons-light")]) {
  for (const [name, body] of Object.entries(ICONS)) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<div class="big">${svg(body)}</div>
      <div class="name">${name}</div>
      <div class="small">${svg(body)}<span>${name === "Office" ? "Office ▸" : name}</span></div>`;
    host.appendChild(cell);
  }
}
</script>
</body></html>
