<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Glyphh Office — icon set</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, -apple-system, system-ui, sans-serif; background: #0d0d0f; color: #f1f1f1; padding: 48px 56px; }
  h1 { font-size: 26px; letter-spacing: -.02em; }
  .sub { margin-top: 8px; color: #8e8e9c; font-size: 14px; max-width: 640px; line-height: 1.5; }
  .band { border-radius: 14px; padding: 36px 40px 28px; margin-top: 28px; }
  .band.dark  { background: #101013; border: 1px solid #26262d; color: #fff; }
  .band.light { background: #fafafa; border: 1px solid #e2e2e6; color: #111; }
  .band h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .5; margin-bottom: 24px; font-weight: 600; }
  .row { display: flex; gap: 56px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cell svg { display: block; }
  .cell .big svg { width: 64px; height: 64px; }
  .cell .small { display: flex; gap: 10px; align-items: center; margin-top: 2px; opacity: .85; }
  .cell .small svg { width: 18px; height: 18px; }
  .cell .small span { font-size: 12.5px; }
  .name { font-size: 13px; font-weight: 600; }
  .band svg { fill: none; }
</style></head>
<body>
<h1>Glyphh Office — icon set</h1>
<p class="sub">One stroke language, filled two-tone marks in the Glyphh palette: 24×24 grid, 2px stroke,
round caps, <code>currentColor</code> — white on dark, ink on light, no palette to maintain.
Slides carries the play mark; the suite mark is the briefcase.</p>

<div class="band dark">
  <h2>On dark — the app</h2>
  <div class="row" id="icons-dark"></div>
</div>
<div class="band light">
  <h2>On light</h2>
  <div class="row" id="icons-light"></div>
</div>

<script>
const ICONS = {
  "Office": "<path d=\"M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7h-2V5.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5V7z\" style=\"fill:#6d28d9;stroke:none\"/><rect x=\"2.5\" y=\"7\" width=\"19\" height=\"13.5\" rx=\"2.5\" style=\"fill:#8c3bf2;stroke:none\"/><path d=\"M2.5 12.2h19v2.2h-19z\" style=\"fill:#6d28d9;stroke:none\"/><rect x=\"10.3\" y=\"11.6\" width=\"3.4\" height=\"3.4\" rx=\"1.1\" style=\"fill:#ffffff;stroke:none\"/>",
  "Drive": "<path d=\"M6.1 4.6A2.5 2.5 0 0 1 8.4 3h7.2a2.5 2.5 0 0 1 2.3 1.6L21.5 12h-19z\" style=\"fill:#2dd4bf;stroke:none\"/><path d=\"M2.5 12h19v5.5A2.5 2.5 0 0 1 19 20H5a2.5 2.5 0 0 1-2.5-2.5z\" style=\"fill:#0f766e;stroke:none\"/><circle cx=\"6.8\" cy=\"16\" r=\"1.25\" style=\"fill:#ffffff;stroke:none\"/><circle cx=\"10.6\" cy=\"16\" r=\"1.25\" style=\"fill:#5eead4;stroke:none\"/>",
  "Docs": "<path d=\"M5 4.5A2.5 2.5 0 0 1 7.5 2h7L20 7.5v12A2.5 2.5 0 0 1 17.5 22h-10A2.5 2.5 0 0 1 5 19.5z\" style=\"fill:#3b82f6;stroke:none\"/><path d=\"M14.5 2 20 7.5h-4A1.5 1.5 0 0 1 14.5 6z\" style=\"fill:#1d4ed8;stroke:none\"/><rect x=\"8\" y=\"10.6\" width=\"8\" height=\"1.7\" rx=\"0.85\" style=\"fill:#ffffff;stroke:none\"/><rect x=\"8\" y=\"14\" width=\"8\" height=\"1.7\" rx=\"0.85\" style=\"fill:#ffffff;stroke:none\"/><rect x=\"8\" y=\"17.4\" width=\"5.2\" height=\"1.7\" rx=\"0.85\" style=\"fill:#ffffff;stroke:none\"/>",
  "Sheets": "<rect x=\"2.5\" y=\"2.5\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#10b981;stroke:none\"/><rect x=\"6\" y=\"5.6\" width=\"12\" height=\"2.4\" rx=\"1.2\" style=\"fill:#ffffff;stroke:none\"/><rect x=\"6\" y=\"10\" width=\"5.4\" height=\"3.6\" rx=\"1\" style=\"fill:#a7f3d0;stroke:none\"/><rect x=\"12.6\" y=\"10\" width=\"5.4\" height=\"3.6\" rx=\"1\" style=\"fill:#ffffff;stroke:none\"/><rect x=\"6\" y=\"14.8\" width=\"5.4\" height=\"3.6\" rx=\"1\" style=\"fill:#ffffff;stroke:none\"/><rect x=\"12.6\" y=\"14.8\" width=\"5.4\" height=\"3.6\" rx=\"1\" style=\"fill:#a7f3d0;stroke:none\"/>",
  "Slides": "<rect x=\"2\" y=\"3.5\" width=\"20\" height=\"13\" rx=\"2.5\" style=\"fill:#8c3bf2;stroke:none\"/><path d=\"M11 16.5h2v2.2h3.2a.9.9 0 1 1 0 1.8H7.8a.9.9 0 1 1 0-1.8H11z\" style=\"fill:#6d28d9;stroke:none\"/><path d=\"M10 7.2 15.4 10 10 12.8z\" style=\"fill:#ffffff;stroke:none\"/>",
};
const svg = (body) => `<svg viewBox="0 0 24 24">${body}</svg>`;
for (const host of [document.getElementById("icons-dark"), document.getElementById("icons-light")]) {
  for (const [name, body] of Object.entries(ICONS)) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<div class="big">${svg(body)}</div>
      <div class="name">${name}</div>
      <div class="small">${svg(body)}<span>${name === "Office" ? "Office ▸" : name}</span></div>`;
    host.appendChild(cell);
  }
}
</script>
</body></html>
