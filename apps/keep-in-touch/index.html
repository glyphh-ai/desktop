<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keep in Touch</title>
  <style>
    :root {
      --bg: #1a1a1c; --surface: #232326; --surface-2: #2c2c30; --border: #3a3a3f;
      --text: #f2f2f4; --text-2: #a8a8b0; --text-3: #77777f;
      --accent: #2e7cf6; --accent-2: #1f6ae0; --danger: #ef4444; --ok: #22c55e; --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; height: 100vh; -webkit-user-select: none; user-select: none;
    }
    header { padding: 18px 20px 12px; display: flex; align-items: baseline; gap: 10px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
    .due-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
                background: rgba(245,158,11,.15); color: var(--warn); }
    .due-pill.clear { background: rgba(34,197,94,.12); color: var(--ok); }
    .list { flex: 1; overflow-y: auto; padding: 0 14px 8px; }
    .empty { color: var(--text-3); font-size: 13px; text-align: center; margin-top: 40px; line-height: 1.6; }
    .person { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
              padding: 12px 14px; margin: 8px 0; }
    .person.due { border-color: rgba(245,158,11,.45); }
    .row1 { display: flex; align-items: center; gap: 8px; }
    .pname { font-size: 14px; font-weight: 650; flex: 1; }
    .badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .badge.due { background: rgba(245,158,11,.15); color: var(--warn); }
    .badge.ok { background: rgba(34,197,94,.10); color: var(--ok); }
    .meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
    .notes { font-size: 12px; color: var(--text-2); margin-top: 5px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .actions button:hover { border-color: var(--accent); }
    .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .actions button.primary:hover { background: var(--accent-2); }
    .actions .spacer { flex: 1; }
    .actions button.ghost { border: none; background: none; color: var(--text-3); padding: 6px 4px; }
    .actions button.ghost:hover { color: var(--danger); }
    .composer { margin-top: 10px; display: none; }
    .composer.open { display: block; }
    .composer textarea {
      width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; font-size: 13px; outline: none; font-family: inherit;
      min-height: 64px; resize: vertical; -webkit-user-select: text; user-select: text;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .actions { margin-top: 8px; }
    footer { border-top: 1px solid var(--border); padding: 12px 20px 16px; }
    .add-toggle { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
                  padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .add-toggle:hover { background: var(--accent-2); }
    form { display: none; }
    form.open { display: block; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: .04em; color: var(--text-2); margin: 10px 0 5px; }
    input, select {
      width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; font-size: 13px; outline: none; font-family: inherit;
      -webkit-user-select: text; user-select: text;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .suggest { position: relative; }
    .suggest-list { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin-top: 4px;
                    background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
                    max-height: 150px; overflow-y: auto; display: none; }
    .suggest-list.open { display: block; }
    .suggest-list button { display: block; width: 100%; text-align: left; background: none; border: none;
                           color: var(--text); padding: 8px 11px; font-size: 12.5px; cursor: pointer; }
    .suggest-list button:hover { background: rgba(46,124,246,.15); }
    .suggest-list .sub { color: var(--text-3); font-size: 11px; }
    .formrow { display: flex; gap: 10px; }
    .formrow > div { flex: 1; }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; }
    .form-actions button { flex: 1; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .save { background: var(--accent); border: none; color: #fff; }
    .save:hover { background: var(--accent-2); }
    .cancel { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
    .status { font-size: 12px; margin-top: 8px; text-align: center; min-height: 15px; color: var(--text-3); }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Keep in Touch</h1>
    <span id="duePill" class="due-pill clear">all caught up</span>
  </header>

  <div id="list" class="list"></div>

  <footer>
    <button id="addToggle" class="add-toggle">+ Add someone</button>
    <form id="addForm" autocomplete="off">
      <label for="fName">Name</label>
      <div class="suggest">
        <input id="fName" type="text" placeholder="Mom, Sam Rivera…" spellcheck="false" />
        <div id="suggestList" class="suggest-list"></div>
      </div>
      <label for="fHandle">Phone / handle</label>
      <input id="fHandle" type="text" inputmode="tel" placeholder="+1 555 123 4567" spellcheck="false" />
      <div class="formrow">
        <div>
          <label for="fCadence">Reach out every</label>
          <select id="fCadence">
            <option value="7">week</option>
            <option value="14" selected>2 weeks</option>
            <option value="30">month</option>
            <option value="60">2 months</option>
            <option value="90">3 months</option>
          </select>
        </div>
        <div>
          <label for="fNotes">Notes</label>
          <input id="fNotes" type="text" placeholder="college roommate…" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" id="cancelAdd" class="cancel">Cancel</button>
        <button type="submit" class="save">Save</button>
      </div>
    </form>
    <div id="status" class="status"></div>
  </footer>

  <script>
    const g = window.glyphh;
    const $ = (id) => document.getElementById(id);
    const listEl = $("list"), duePill = $("duePill"), statusEl = $("status");
    const addForm = $("addForm"), addToggle = $("addToggle");

    async function call(method, args) {
      const res = await g.call(method, args);
      if (!res.ok) throw new Error(res.error);
      return res.result;
    }

    const DUE_WHERE = "(last_touch IS NULL OR julianday('now') - julianday(last_touch) >= cadence_days)";

    async function ensureSchema() {
      await call("db.exec", { sql: `CREATE TABLE IF NOT EXISTS people (
        id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, handle TEXT NOT NULL,
        cadence_days INTEGER NOT NULL DEFAULT 14, notes TEXT, last_touch TEXT,
        created_at TEXT NOT NULL DEFAULT (datetime('now')))` });
      await call("db.exec", { sql: "CREATE UNIQUE INDEX IF NOT EXISTS idx_people_name ON people (name COLLATE NOCASE)" });
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
      if (msg) setTimeout(() => { if (statusEl.textContent === msg) setStatus(""); }, 4000);
    }

    function daysWord(n) {
      n = Math.round(n);
      if (n <= 0) return "today";
      return n === 1 ? "1 day" : n + " days";
    }

    function personCard(p) {
      const card = document.createElement("div");
      card.className = "person" + (p.due ? " due" : "");
      const badge = p.due
        ? `<span class="badge due">${p.last_touch ? "overdue " + daysWord(p.overdue) : "never contacted"}</span>`
        : `<span class="badge ok">next in ${daysWord(p.next_in)}</span>`;
      card.innerHTML = `
        <div class="row1"><span class="pname"></span>${badge}</div>
        <div class="meta"></div>
        ${p.notes ? '<div class="notes"></div>' : ""}
        <div class="actions">
          <button class="primary" data-act="text">Text</button>
          <button data-act="log">Log touch</button>
          <span class="spacer"></span>
          <button class="ghost" data-act="remove" title="Remove">✕</button>
        </div>
        <div class="composer">
          <textarea placeholder="Hey! Been a while — how are you?"></textarea>
          <div class="actions">
            <button class="primary" data-act="send">Send via Messages</button>
            <button data-act="closeComposer">Cancel</button>
          </div>
        </div>`;
      card.querySelector(".pname").textContent = p.name;
      card.querySelector(".meta").textContent =
        p.handle + " · every " + p.cadence_days + "d" + (p.last_touch ? " · last touch " + p.last_touch.slice(0, 10) : "");
      if (p.notes) card.querySelector(".notes").textContent = p.notes;

      const composer = card.querySelector(".composer");
      card.addEventListener("click", async (e) => {
        const act = e.target.dataset && e.target.dataset.act;
        if (!act) return;
        e.preventDefault();
        try {
          if (act === "text") composer.classList.toggle("open");
          if (act === "closeComposer") composer.classList.remove("open");
          if (act === "log") {
            await call("db.exec", { sql: "UPDATE people SET last_touch = datetime('now') WHERE id = ?", params: [p.id] });
            setStatus("Logged ✓", "ok");
            await refresh();
          }
          if (act === "remove") {
            await call("db.exec", { sql: "DELETE FROM people WHERE id = ?", params: [p.id] });
            await refresh();
          }
          if (act === "send") {
            const body = composer.querySelector("textarea").value.trim();
            if (!body) return;
            e.target.disabled = true;
            await call("messages.send", { to: p.handle, body });
            await call("db.exec", { sql: "UPDATE people SET last_touch = datetime('now') WHERE id = ?", params: [p.id] });
            setStatus("Sent to " + p.name + " ✓", "ok");
            await refresh();
          }
        } catch (err) {
          setStatus(err.message, "err");
          if (e.target) e.target.disabled = false;
        }
      });
      return card;
    }

    async function refresh() {
      const { rows } = await call("db.exec", {
        sql: `SELECT id, name, handle, cadence_days, notes, last_touch,
                ${DUE_WHERE} AS due,
                CASE WHEN last_touch IS NULL THEN NULL
                     ELSE julianday('now') - julianday(last_touch) - cadence_days END AS overdue,
                CASE WHEN last_touch IS NULL THEN 0
                     ELSE cadence_days - (julianday('now') - julianday(last_touch)) END AS next_in
              FROM people ORDER BY due DESC, overdue DESC, name`,
      });
      listEl.textContent = "";
      if (!rows.length) {
        listEl.innerHTML = `<div class="empty">No one yet.<br/>Add the people you never want to lose touch with —<br/>Glyphh nudges you when it's time.</div>`;
      }
      for (const p of rows) listEl.appendChild(personCard(p));
      const due = rows.filter((r) => r.due).length;
      duePill.textContent = due ? due + " due" : "all caught up";
      duePill.className = "due-pill" + (due ? "" : " clear");
    }

    // ── add form (with Contacts autocomplete) ──────────────
    const suggestList = $("suggestList");
    let suggestTimer = null;
    $("fName").addEventListener("input", () => {
      clearTimeout(suggestTimer);
      const q = $("fName").value.trim();
      if (q.length < 2) { suggestList.className = "suggest-list"; return; }
      suggestTimer = setTimeout(async () => {
        try {
          const res = await g.call("contacts.search", { query: q });
          if (!res.ok || !res.result.length) { suggestList.className = "suggest-list"; return; }
          suggestList.textContent = "";
          for (const c of res.result.slice(0, 6)) {
            const b = document.createElement("button");
            b.type = "button";
            b.innerHTML = `<span></span> <span class="sub"></span>`;
            b.children[0].textContent = c.name;
            b.children[1].textContent = c.value;
            b.addEventListener("click", () => {
              $("fName").value = c.name;
              $("fHandle").value = c.value;
              suggestList.className = "suggest-list";
            });
            suggestList.appendChild(b);
          }
          suggestList.className = "suggest-list open";
        } catch { suggestList.className = "suggest-list"; }
      }, 250);
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".suggest")) suggestList.className = "suggest-list";
    });

    function toggleForm(open) {
      addForm.className = open ? "open" : "";
      addToggle.style.display = open ? "none" : "";
      if (open) $("fName").focus();
    }
    addToggle.addEventListener("click", () => toggleForm(true));
    $("cancelAdd").addEventListener("click", () => toggleForm(false));

    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("fName").value.trim(), handle = $("fHandle").value.trim();
      if (!name || !handle) { setStatus("Name and handle are required", "err"); return; }
      try {
        await call("db.exec", {
          sql: `INSERT INTO people (name, handle, cadence_days, notes) VALUES (?, ?, ?, ?)
                ON CONFLICT (name COLLATE NOCASE) DO UPDATE SET
                  handle = excluded.handle, cadence_days = excluded.cadence_days,
                  notes = COALESCE(excluded.notes, people.notes)`,
          params: [name, handle, parseInt($("fCadence").value, 10), $("fNotes").value.trim() || null],
        });
        addForm.reset();
        toggleForm(false);
        setStatus("Saved " + name + " ✓", "ok");
        await refresh();
      } catch (err) {
        setStatus(err.message, "err");
      }
    });

    (async () => {
      try {
        await ensureSchema();
        await refresh();
      } catch (err) {
        setStatus(err.message, "err");
      }
    })();
  </script>
</body>
</html>
