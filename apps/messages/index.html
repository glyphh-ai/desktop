<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send Message</title>
  <style>
    :root {
      --bg: #1a1a1c; --surface: #242427; --surface-2: #2c2c30; --border: #3a3a3f;
      --text: #f2f2f4; --text-2: #a8a8b0; --text-3: #77777f;
      --accent: #2e7cf6; --accent-2: #1f6ae0; --danger: #ef4444; --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; height: 100vh; -webkit-user-select: none; user-select: none;
    }
    header { padding: 18px 20px 12px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 12px; color: var(--text-3); }
    .body { flex: 1; overflow-y: auto; padding: 4px 20px 8px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.04em; color: var(--text-2); margin: 14px 0 6px; }
    input, textarea {
      width: 100%; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
      font-size: 14px; outline: none; font-family: inherit; -webkit-user-select: text; user-select: text;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 92px; }
    .results { margin-top: 8px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .results:empty { display: none; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--surface-2); }
    .row.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .row-name { font-size: 13px; font-weight: 500; }
    .row-val { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; color: var(--text-3); padding: 8px 2px; }
    .chosen {
      margin-top: 8px; display: none; align-items: center; gap: 8px;
      background: var(--surface-2); border: 1px solid var(--accent); border-radius: 9px; padding: 8px 12px;
    }
    .chosen.show { display: flex; }
    .chosen-name { font-size: 13px; font-weight: 600; }
    .chosen-val { font-size: 12px; color: var(--text-2); }
    .chosen-x { margin-left: auto; background: none; border: none; color: var(--text-3);
                font-size: 18px; cursor: pointer; line-height: 1; }
    footer { padding: 12px 20px 18px; border-top: 1px solid var(--border); }
    .send {
      width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .send:hover { background: var(--accent-2); }
    .send:disabled { opacity: 0.45; cursor: default; }
    .status { font-size: 12px; margin-top: 10px; text-align: center; min-height: 16px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Send Message</h1>
    <p>Pick a contact and text them through Messages.</p>
  </header>

  <div class="body">
    <label for="q">To</label>
    <input id="q" type="text" placeholder="Search contacts by name…" autocomplete="off" spellcheck="false" />
    <div id="chosen" class="chosen">
      <div>
        <div id="chosen-name" class="chosen-name"></div>
        <div id="chosen-val" class="chosen-val"></div>
      </div>
      <button id="chosen-x" class="chosen-x" title="Change">&times;</button>
    </div>
    <div id="results" class="results"></div>
    <div id="results-hint" class="hint"></div>

    <label for="body">Message</label>
    <textarea id="body" placeholder="Type your message…"></textarea>
  </div>

  <footer>
    <button id="send" class="send" disabled>Send</button>
    <div id="status" class="status"></div>
  </footer>

  <script>
    const g = window.glyphh;
    const qEl = document.getElementById("q");
    const resultsEl = document.getElementById("results");
    const hintEl = document.getElementById("results-hint");
    const chosenEl = document.getElementById("chosen");
    const chosenNameEl = document.getElementById("chosen-name");
    const chosenValEl = document.getElementById("chosen-val");
    const bodyEl = document.getElementById("body");
    const sendEl = document.getElementById("send");
    const statusEl = document.getElementById("status");

    let chosen = null;
    let searchTimer = null;
    let seq = 0;

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }
    function refreshSendState() {
      sendEl.disabled = !(chosen && bodyEl.value.trim());
    }

    function pick(name, value) {
      chosen = { name, value };
      chosenNameEl.textContent = name;
      chosenValEl.textContent = value;
      chosenEl.classList.add("show");
      resultsEl.innerHTML = "";
      hintEl.textContent = "";
      qEl.value = "";
      qEl.style.display = "none";
      refreshSendState();
      bodyEl.focus();
    }
    function clearChosen() {
      chosen = null;
      chosenEl.classList.remove("show");
      qEl.style.display = "";
      qEl.value = "";
      qEl.focus();
      refreshSendState();
    }

    async function search(query) {
      const mySeq = ++seq;
      hintEl.textContent = "Searching…";
      const res = await g.call("contacts.search", { query });
      if (mySeq !== seq) return; // a newer search superseded this one
      resultsEl.innerHTML = "";
      if (!res.ok) { hintEl.textContent = "Couldn't read contacts: " + res.error; return; }
      const rows = res.result || [];
      if (rows.length === 0) { hintEl.textContent = "No matches."; return; }
      hintEl.textContent = "";
      for (const r of rows) {
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `<span class="row-name"></span><span class="row-val"></span>`;
        div.querySelector(".row-name").textContent = r.name;
        div.querySelector(".row-val").textContent = r.value;
        div.addEventListener("click", () => pick(r.name, r.value));
        resultsEl.appendChild(div);
      }
    }

    qEl.addEventListener("input", () => {
      const query = qEl.value.trim();
      clearTimeout(searchTimer);
      if (query.length < 2) { resultsEl.innerHTML = ""; hintEl.textContent = query ? "Keep typing…" : ""; return; }
      searchTimer = setTimeout(() => search(query), 220);
    });
    document.getElementById("chosen-x").addEventListener("click", clearChosen);
    bodyEl.addEventListener("input", refreshSendState);

    sendEl.addEventListener("click", async () => {
      if (!chosen) return;
      sendEl.disabled = true;
      setStatus("Sending…");
      const res = await g.call("messages.send", { to: chosen.value, body: bodyEl.value });
      if (res.ok) {
        setStatus("Sent to " + chosen.name + " ✓", "ok");
        bodyEl.value = "";
      } else {
        setStatus(res.error, "err");
      }
      refreshSendState();
    });

    qEl.focus();
  </script>
</body>
</html>
