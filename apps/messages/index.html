<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send Message</title>
  <style>
    :root {
      --bg: #1a1a1c; --surface-2: #2c2c30; --border: #3a3a3f;
      --text: #f2f2f4; --text-2: #a8a8b0; --text-3: #77777f;
      --accent: #2e7cf6; --accent-2: #1f6ae0; --danger: #ef4444; --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; height: 100vh; -webkit-user-select: none; user-select: none;
    }
    header { padding: 18px 20px 10px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 12px; color: var(--text-3); }
    .body { flex: 1; overflow-y: auto; padding: 6px 20px 8px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.04em; color: var(--text-2); margin: 14px 0 6px; }
    input, textarea {
      width: 100%; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px;
      font-size: 14px; outline: none; font-family: inherit; -webkit-user-select: text; user-select: text;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 110px; }
    .hint { font-size: 11px; color: var(--text-3); margin-top: 6px; }
    footer { padding: 12px 20px 18px; border-top: 1px solid var(--border); }
    .send {
      width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .send:hover { background: var(--accent-2); }
    .send:disabled { opacity: 0.45; cursor: default; }
    .status { font-size: 12px; margin-top: 10px; text-align: center; min-height: 16px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Send Message</h1>
    <p>Text a phone number through Messages.</p>
  </header>

  <div class="body">
    <label for="to">To</label>
    <input id="to" type="text" inputmode="tel" placeholder="+1 555 123 4567" autocomplete="off" spellcheck="false" />
    <div class="hint">Phone number, email, or iMessage handle.</div>

    <label for="body">Message</label>
    <textarea id="body" placeholder="Type your message…"></textarea>
  </div>

  <footer>
    <button id="send" class="send" disabled>Send</button>
    <div id="status" class="status"></div>
  </footer>

  <script>
    const g = window.glyphh;
    const toEl = document.getElementById("to");
    const bodyEl = document.getElementById("body");
    const sendEl = document.getElementById("send");
    const statusEl = document.getElementById("status");

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }
    function refresh() {
      sendEl.disabled = !(toEl.value.trim() && bodyEl.value.trim());
    }
    toEl.addEventListener("input", () => { refresh(); setStatus(""); });
    bodyEl.addEventListener("input", refresh);

    sendEl.addEventListener("click", async () => {
      const to = toEl.value.trim();
      const body = bodyEl.value;
      if (!to || !body.trim()) return;
      sendEl.disabled = true;
      setStatus("Sending…");
      const res = await g.call("messages.send", { to, body });
      if (res.ok) {
        setStatus("Sent to " + to + " ✓", "ok");
        bodyEl.value = "";
      } else {
        setStatus(res.error, "err");
      }
      refresh();
    });

    toEl.focus();
  </script>
</body>
</html>
