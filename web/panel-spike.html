<!doctype html>
<!--
  panel-spike.html — SPIKE: the WEB client for the desktop→web panel stream.

  Standalone test view (NOT wired into the app-web shell — that's fine for a
  spike). It:
    • opens a WS to <server>/ws/panel?token=<gy_at_…>,
    • sends panel.open {url} → the server relays it to THIS user's attached
      desktop, which opens a real page + starts the CDP screencast,
    • receives {t:"push", channel, data:{type:"frame",data:<b64 jpeg>}} → draws
      to a canvas, measuring latency + bytes/sec,
    • captures mouse/keyboard/wheel on the canvas → panel.input back.

  No build step, no framework — inline so it runs from any static host on a
  spare port without touching the real app-web serve.
-->
<meta charset="utf-8" />
<title>Panel Spike</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 8px; background: #1c1c1c; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input { font: inherit; padding: 4px 6px; border: 1px solid #333; background: #000; color: #eee; border-radius: 4px; }
  input#url { width: 340px; }
  input#token { width: 260px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #444; background: #2a2a2a; color: #eee; border-radius: 4px; cursor: pointer; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #9ad; white-space: pre; }
  #wrap { padding: 8px; }
  canvas { background: #000; display: block; max-width: 100%; border: 1px solid #333; cursor: crosshair; }
  #log { padding: 6px 8px; font: 11px monospace; color: #888; max-height: 90px; overflow: auto; white-space: pre-wrap; }
</style>
<header>
  <label>server <input id="server" value="ws://localhost:3099" /></label>
  <label>token <input id="token" placeholder="gy_at_…" /></label>
  <input id="url" value="https://claude.ai" />
  <button id="open">open panel</button>
  <button id="close">close</button>
  <span id="stats"></span>
</header>
<div id="wrap"><canvas id="cv" width="1280" height="800" tabindex="0"></canvas></div>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const logEl = $("log");
function log(...a) { logEl.textContent = a.join(" ") + "\n" + logEl.textContent; }

let ws = null, panelId = null, seq = 0;
const pending = new Map();

// latency + bandwidth measurement
let frameCount = 0, byteCount = 0, lastReport = performance.now();
let latSum = 0, latN = 0;

function call(method, params) {
  return new Promise((resolve, reject) => {
    const id = "w" + (++seq);
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ t: "req", id, method, params }));
  });
}

function connect() {
  const base = $("server").value.replace(/\/$/, "");
  const token = encodeURIComponent($("token").value.trim());
  ws = new WebSocket(`${base}/ws/panel?token=${token}`);
  ws.onopen = () => log("panel ws open");
  ws.onclose = () => log("panel ws closed");
  ws.onerror = () => log("panel ws error");
  ws.onmessage = (ev) => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    if (f.t === "res") {
      const p = pending.get(f.id); if (!p) return; pending.delete(f.id);
      f.ok ? p.resolve(f.result) : p.reject(new Error(f.error));
    } else if (f.t === "push" && f.channel === panelId) {
      onPush(f.data);
    }
  };
}

function onPush(d) {
  if (!d) return;
  if (d.type === "frame") {
    byteCount += (d.data ? d.data.length : 0);
    if (typeof d.at === "number") { latSum += Math.max(0, Date.now() - d.at); latN++; }
    const img = new Image();
    img.onload = () => {
      if (cv.width !== img.width || cv.height !== img.height) { cv.width = img.width; cv.height = img.height; }
      ctx.drawImage(img, 0, 0);
      frameCount++;
    };
    img.src = "data:image/jpeg;base64," + d.data;
  } else if (d.type === "nav") {
    log("nav →", d.url, "|", d.title || "");
    if (d.url) $("url").value = d.url;
  }
}

setInterval(() => {
  const now = performance.now(), dt = (now - lastReport) / 1000;
  const fps = (frameCount / dt).toFixed(1);
  const kbs = (byteCount / 1024 / dt).toFixed(0);
  const lat = latN ? (latSum / latN).toFixed(0) : "–";
  $("stats").textContent = `${fps} fps  ${kbs} KB/s  ~${lat}ms lat`;
  frameCount = 0; byteCount = 0; latSum = 0; latN = 0; lastReport = now;
}, 1000);

// ── input capture ──────────────────────────────────────────────────────────
// Canvas is drawn at the panel's device pixels; map client coords → canvas px.
function pt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
}
function modBits(e) { return (e.altKey?1:0) | (e.ctrlKey?2:0) | (e.metaKey?4:0) | (e.shiftKey?8:0); }
const BTN = ["left", "middle", "right"];
function sendInput(event) { if (panelId) ws.send(JSON.stringify({ t: "req", id: "i" + (++seq), method: "panel.input", params: { panelId, event } })); }

cv.addEventListener("mousemove", (e) => { const {x,y} = pt(e); sendInput({ type:"mouse", action:"move", x, y, buttons:e.buttons, mods:modBits(e) }); });
cv.addEventListener("mousedown", (e) => { cv.focus(); const {x,y} = pt(e); sendInput({ type:"mouse", action:"down", x, y, button:BTN[e.button]||"left", buttons:e.buttons, mods:modBits(e), clickCount:e.detail||1 }); });
cv.addEventListener("mouseup", (e) => { const {x,y} = pt(e); sendInput({ type:"mouse", action:"up", x, y, button:BTN[e.button]||"left", buttons:e.buttons, mods:modBits(e), clickCount:e.detail||1 }); });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("wheel", (e) => { e.preventDefault(); const {x,y} = pt(e); sendInput({ type:"wheel", x, y, dx:e.deltaX, dy:e.deltaY, mods:modBits(e) }); }, { passive:false });
cv.addEventListener("keydown", (e) => { e.preventDefault(); const text = e.key.length===1 ? e.key : ""; sendInput({ type:"key", action:"down", key:e.key, code:e.code, text, mods:modBits(e) }); });
cv.addEventListener("keyup", (e) => { e.preventDefault(); sendInput({ type:"key", action:"up", key:e.key, code:e.code, mods:modBits(e) }); });

$("open").onclick = async () => {
  if (!ws || ws.readyState !== 1) connect();
  const wait = () => new Promise(r => ws.readyState === 1 ? r() : ws.addEventListener("open", r, {once:true}));
  await wait();
  try {
    const r = await call("panel.open", { url: $("url").value, width: cv.width, height: cv.height, quality: 70 });
    panelId = r.panelId; log("panel open:", panelId); cv.focus();
  } catch (e) { log("open failed:", e.message); }
};
$("close").onclick = async () => { if (panelId) { try { const s = await call("panel.close", { panelId }); log("closed:", JSON.stringify(s)); } catch(e){ log(e.message); } panelId = null; } };

connect();
</script>
