<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glyphh</title>
  <meta name="theme-color" content="#000000">
  <script>
    // Apply the USER'S theme synchronously before paint — same script the app
    // shells use (index/home.template.html). No hardcoded theme.
    try {
      var t = localStorage.getItem('yoTheme') || 'dark';
      var r = t === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : t;
      document.documentElement.setAttribute('data-theme', r);
      // Early best-effort Safari tint; the app refines it to the exact --bg once
      // the stylesheet is live (syncThemeColor) so every theme matches.
      var early = r === 'light' ? '#ffffff' : '#000000';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', early);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glyphh">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/brand/icons/icon-180.png">
  <link rel="icon" href="/brand/glyphh-mark.png">
  <!-- The mobile app's OWN stylesheet: real Geist and JetBrains Mono fonts + real token values +
       real button, extracted from the design system. No desktop CSS. -->
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <div id="glyphh-mobile-root"></div>
  <!-- serve.mjs injects window.__GLYPHH_*__ config before this script -->
  <script src="/glyphh-mobile.js" defer></script>
</body>
</html>
