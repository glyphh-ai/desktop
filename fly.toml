# app-web on Fly — the SDK-direct web target (future app.glyphh.ai).
#
# Deploys go through GitHub Actions (.github/workflows/deploy-web.yml) — never a
# local `fly deploy`. Naming convention: Fly apps are <org-slug>-<folder> —
# glyphh-ai-app, mirroring the GitHub repo (glyphh-ai/app).
#
# [env] is RUNTIME config: serve.mjs reads process.env (over web/.env, which is
# not in the image) and injects these as window.__GLYPHH_* before the bridge —
# the SDK talks DIRECTLY to the control-plane API, no proxy here.

app = "glyphh-ai-app"
primary_region = "iad"

[env]
  PORT = "3002"
  GLYPHH_SERVER_URL = "https://glyphh-ai-server.fly.dev"
  GLYPHH_GOOGLE_CLIENT_ID = "247280496034-equmvbu3j8qpd5karj7e22f71v6flm1s.apps.googleusercontent.com"
  GLYPHH_WEB_URL = "https://glyphh.ai"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # App front door: keep one machine warm — no cold starts at login.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.http]
    type = "http"
    port = 3002
    # "/" serves the login shell (index.html) with a 200.
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
