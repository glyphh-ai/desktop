name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pin Python to 3.11 + ensure setuptools is available. macos-latest
      # ships Python 3.12+, which removed `distutils` from stdlib. node-gyp
      # still imports it during electron-rebuild for native deps that don't
      # have prebuilt x64-darwin binaries (node-pty in particular). Without
      # this the multi-arch build fails on the x64 rebuild pass.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install setuptools (provides distutils for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      # ── Vendor the SDK ──────────────────────────────────────────────
      # package.json depends on `@glyphh/sdk: file:../sdk` — a sibling
      # checkout that exists locally but not in CI. Same self-heal as the
      # platform's deploy workflow: check out sdk@main, build it, and place
      # package.json + dist at ../sdk so the lockfile's link resolves.
      - uses: actions/checkout@v4
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src

      - name: Build the SDK (file:../sdk dependency)
        shell: bash
        run: |
          cd .sdk-src
          npm ci
          npm run build
          cd ..
          rm -rf ../sdk
          mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      - name: Install dependencies
        run: npm ci

      # (The pre-cutover "vendor claude CLI binaries" step lived here. THE
      # CUTOVER (0a31fe25) removed @anthropic-ai/claude-agent-sdk from the
      # desktop — turns run on the harness pod now — so there is nothing to
      # vendor, and the old hard guard failed every post-cutover tag build.)

      - name: Build
        run: npm run build

      # electron-builder's asar packer refuses files outside the app dir,
      # and node_modules/@glyphh/sdk is a SYMLINK to ../sdk (outside).
      # Replace the link with a real copy before packaging.
      - name: Materialize @glyphh/sdk (asar cannot follow ../sdk)
        shell: bash
        run: |
          rm -rf node_modules/@glyphh/sdk
          mkdir -p node_modules/@glyphh/sdk
          cp ../sdk/package.json node_modules/@glyphh/sdk/package.json
          cp -R ../sdk/dist node_modules/@glyphh/sdk/dist

      - name: Package macOS (signed + notarized)
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yo-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  build-win:
    # Pinned to windows-2022: the windows-latest image (now windows-2025) ships
    # a Visual Studio layout node-gyp can't detect, so the electron-rebuild of
    # node-pty fails with "Could not find any Visual Studio installation".
    # windows-2022 has the VS2022 C++ toolchain node-gyp finds out of the box.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Vendor the SDK ──────────────────────────────────────────────
      # package.json depends on `@glyphh/sdk: file:../sdk` — a sibling
      # checkout that exists locally but not in CI. Same self-heal as the
      # platform's deploy workflow: check out sdk@main, build it, and place
      # package.json + dist at ../sdk so the lockfile's link resolves.
      - uses: actions/checkout@v4
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src

      - name: Build the SDK (file:../sdk dependency)
        shell: bash
        run: |
          cd .sdk-src
          npm ci
          npm run build
          cd ..
          rm -rf ../sdk
          mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # electron-builder's asar packer refuses files outside the app dir,
      # and node_modules/@glyphh/sdk is a SYMLINK to ../sdk (outside).
      # Replace the link with a real copy before packaging.
      - name: Materialize @glyphh/sdk (asar cannot follow ../sdk)
        shell: bash
        run: |
          rm -rf node_modules/@glyphh/sdk
          mkdir -p node_modules/@glyphh/sdk
          cp ../sdk/package.json node_modules/@glyphh/sdk/package.json
          cp -R ../sdk/dist node_modules/@glyphh/sdk/dist

      - name: Package Windows (unsigned)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign Windows exe with SSL.com
        uses: sslcom/esigner-codesign@main
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: release/Glyphh-Setup.exe
          output_path: release/signed
          malware_block: false

      - name: Replace unsigned exe with signed
        run: Move-Item -Force release\signed\Glyphh-Setup.exe release\Glyphh-Setup.exe

      # electron-builder generated latest.yml against the UNSIGNED exe.
      # SSL.com signing changed the file's bytes, so latest.yml's sha512/size
      # no longer match the published exe — every Windows auto-update would
      # fail its integrity check. Recompute them against the signed exe.
      - name: Refresh latest.yml hashes for signed exe
        shell: pwsh
        run: |
          $exe = "release/Glyphh-Setup.exe"
          $stream = [System.IO.File]::OpenRead($exe)
          $sha = [System.Security.Cryptography.SHA512]::Create()
          $hash = [System.Convert]::ToBase64String($sha.ComputeHash($stream))
          $stream.Close()
          $size = (Get-Item $exe).Length
          $ymlPath = (Resolve-Path release/latest.yml).Path
          $yml = Get-Content $ymlPath -Raw
          $yml = $yml -replace 'sha512: .*', "sha512: $hash"
          $yml = $yml -replace 'size: .*', "size: $size"
          [System.IO.File]::WriteAllText($ymlPath, $yml)
          Write-Host "Patched latest.yml: size=$size sha512=$hash"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yo-win
          path: |
            release/*.exe
            release/latest.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/yo-mac/*
            artifacts/yo-win/*

  mirror-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Depend only on the builds — NOT the `release` job. A flaky failure
    # creating the (cosmetic) yo-client draft release must not block
    # publishing to the actual update feed.
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to glyphh-releases
        env:
          GH_TOKEN: ${{ secrets.CLIENT_RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Retry — GitHub's release API is intermittently flaky; a single
          # 5xx must not fail the whole release.
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" \
                --repo glyphh-ai/glyphh-releases \
                --title "$TAG" \
                --notes "Glyphh desktop app $TAG" \
                artifacts/yo-mac/*.dmg \
                artifacts/yo-mac/*.zip \
                artifacts/yo-mac/latest-mac.yml \
                artifacts/yo-win/*.exe \
                artifacts/yo-win/latest.yml; then
              echo "Published $TAG to glyphh-releases (attempt $attempt)"
              exit 0
            fi
            # If the release already exists (a re-run), upload the assets to it.
            if gh release view "$TAG" --repo glyphh-ai/glyphh-releases >/dev/null 2>&1; then
              gh release upload "$TAG" --repo glyphh-ai/glyphh-releases --clobber \
                artifacts/yo-mac/*.dmg artifacts/yo-mac/*.zip artifacts/yo-mac/latest-mac.yml \
                artifacts/yo-win/*.exe artifacts/yo-win/latest.yml \
                && { echo "Uploaded assets to existing $TAG"; exit 0; }
            fi
            echo "Publish attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to publish $TAG to glyphh-releases after 4 attempts"
          exit 1
